name: Capture Cost of Fire media

# One-off, run by hand: screenshots the live page for the opening-screen
# slideshow and saves them to the firecost-media branch. Uploads nothing to the website.

on:
  workflow_dispatch:
    inputs:
      fire:
        description: 'Fire id to capture'
        default: '2026-WAOWF-260406'

jobs:
  capture:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet playwright
      - run: python .github/firecost/capture.py out "${{ inputs.fire }}"
      - name: Save to the firecost-media branch
        run: |
          cd out
          git init -q -b firecost-media
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Captured media"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" firecost-media
