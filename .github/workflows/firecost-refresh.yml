name: Refresh Cost of Fire data

# Rebuilds the FireCost fire list and perimeters from NIFC WFIGS once a day
# and uploads them straight to DreamHost. The data is not kept in the repo.

on:
  schedule:
    - cron: '17 10 * * *'   # 10:17 UTC, about 3-4 am Mountain
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the result to the website'
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install shapely
        run: pip install --quiet shapely

      # Stops with an error (and uploads nothing) if WFIGS returns too little.
      - name: Build data from WFIGS
        run: python .github/firecost/refresh.py out

      - name: Summary
        run: |
          cat out/asof.json; echo
          ls out/data | wc -l
          du -sh out

      - name: Set up SSH key
        if: github.event_name == 'schedule' || inputs.upload
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # Perimeter files first, then the fire list, then the date stamp,
      # so the page never points at files that are not there yet.
      - name: Upload to DreamHost
        if: github.event_name == 'schedule' || inputs.upload
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          DEST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:redstonegis.com/FireCost"
          rsync -rlz --checksum -e "$SSH" out/data/ "$DEST/data/"
          rsync -lz --checksum -e "$SSH" out/fires.json "$DEST/fires.json"
          rsync -lz --checksum -e "$SSH" out/asof.json "$DEST/asof.json"
